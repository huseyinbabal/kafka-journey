<meta charset="utf-8">
<title>Kafka Journey</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#ffffff; --surface:#f7f7f7; --card:#ffffff; --border:#e5e5e5; --border2:#cfcfcf;
  --text:#4b4b4b; --muted:#777777; --faint:#afafaf;
  --green:#58cc02; --green-d:#46a302; --green-soft:#d7ffb8;
  --blue:#1cb0f6; --blue-d:#1899d6; --blue-soft:#ddf4ff;
  --orange:#ff9600; --orange-d:#e58900; --orange-soft:#ffe5c2;
  --red:#ff4b4b; --red-d:#ea2b2b; --red-soft:#ffdfe0;
  --purple:#ce82ff; --purple-d:#a560e8; --purple-soft:#f0e0ff;
  --yellow:#ffc800; --yellow-d:#e5a800; --yellow-soft:#fff2b8;
  --code-bg:#f0f4f7; --stage:#fbfbfb; --dot:#e6e6e6;
  --shadow:rgba(0,0,0,.14);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131f24; --surface:#1a272e; --card:#202f36; --border:#37464f; --border2:#4a5c67;
    --text:#f1f7fb; --muted:#c3d0d8; --faint:#7f909a;
    --green-soft:#2a4a14; --blue-soft:#163a4d; --orange-soft:#4a3210; --red-soft:#4d1e1e; --purple-soft:#3a2550; --yellow-soft:#4a3d0a;
    --code-bg:#0f1a1f; --stage:#172329; --dot:#26353c; --shadow:rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#131f24; --surface:#1a272e; --card:#202f36; --border:#37464f; --border2:#4a5c67;
  --text:#f1f7fb; --muted:#c3d0d8; --faint:#7f909a;
  --green-soft:#2a4a14; --blue-soft:#163a4d; --orange-soft:#4a3210; --red-soft:#4d1e1e; --purple-soft:#3a2550; --yellow-soft:#4a3d0a;
  --code-bg:#0f1a1f; --stage:#172329; --dot:#26353c; --shadow:rgba(0,0,0,.45);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:600;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
code,.mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
code{background:var(--code-bg);padding:1px 6px;border-radius:6px;font-size:.88em;font-weight:700}
b{font-weight:900}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
h1,h2,h3{text-wrap:balance;margin:0}
svg{display:block}

/* chunky buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;padding:0 26px;height:50px;background:var(--green);color:#fff;font-weight:900;font-size:15px;letter-spacing:.09em;text-transform:uppercase;box-shadow:0 4px 0 var(--green-d);transition:transform .08s,box-shadow .08s,filter .15s;user-select:none}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--green-d)}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-d)}.btn.blue:active{box-shadow:none}
.btn.ghost{background:var(--card);color:var(--blue);border:2px solid var(--border);box-shadow:0 4px 0 var(--border)}
.btn.ghost:active{box-shadow:none}
.btn.ghost:disabled{color:var(--faint);cursor:not-allowed;filter:none;transform:none;box-shadow:0 4px 0 var(--border)}
.btn.sm{height:42px;padding:0 18px;font-size:13px;border-radius:14px}
.btn.icon{width:44px;height:44px;padding:0;border-radius:14px}

/* ---------- home ---------- */
.home{max-width:1100px;margin:0 auto;padding:24px 24px 64px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:20px;border-bottom:2px solid var(--border)}
.brand{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:900;letter-spacing:-.01em}
.brand-mark{width:40px;height:40px;border-radius:13px;background:var(--green);color:#fff;display:grid;place-items:center;box-shadow:0 3px 0 var(--green-d)}
.stats{display:flex;gap:10px}
.stat{display:flex;align-items:center;gap:7px;font-weight:900;font-size:15px;padding:8px 12px;border-radius:12px;border:2px solid var(--border);background:var(--card)}
.stat.crown{color:var(--yellow-d)}.stat.xp{color:var(--blue-d)}
.hero{padding:36px 0 22px}
.hero h1{font-size:34px;font-weight:900;letter-spacing:-.02em;line-height:1.1}
.hero p{margin:10px 0 0;color:var(--muted);font-size:17px;max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:20px}
.jcard{position:relative;display:flex;flex-direction:column;background:var(--card);border:2px solid var(--border);border-bottom-width:5px;border-radius:22px;overflow:hidden;transition:transform .15s,border-color .15s;text-align:left;padding:0;color:inherit}
.jcard:hover{transform:translateY(-3px);border-color:var(--c)}
.jcard-band{height:110px;background:var(--c-soft);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.jcard-band .big{width:64px;height:64px;border-radius:20px;background:var(--c);color:#fff;display:grid;place-items:center;box-shadow:0 5px 0 var(--c-d);transition:transform .2s}
.jcard:hover .big{transform:scale(1.08) rotate(-4deg)}
.jcard-band .ring{position:absolute;border-radius:50%;border:3px solid var(--c);opacity:.18}
.jcard-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.jcard h3{font-size:19px;font-weight:900;letter-spacing:-.01em}
.jcard p{margin:0;color:var(--muted);font-size:14px;line-height:1.45;flex:1}
.jcard-meta{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.jcard-cta{font-weight:900;color:var(--c-d);letter-spacing:.09em;display:inline-flex;align-items:center;gap:6px}
.done-pill{position:absolute;top:12px;right:12px;background:var(--yellow);color:#5b4300;border-radius:999px;padding:5px 10px 5px 8px;font-size:11px;font-weight:900;letter-spacing:.08em;display:flex;gap:5px;align-items:center;box-shadow:0 3px 0 var(--yellow-d)}
.legend{margin-top:40px;padding:18px 20px;border:2px dashed var(--border);border-radius:18px;color:var(--muted);font-size:14px;display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.legend .k{display:inline-flex;align-items:center;gap:6px;font-weight:800}

/* ---------- lesson ---------- */
.lesson{display:flex;flex-direction:column;min-height:100vh}
.lhead{display:flex;align-items:center;gap:18px;padding:18px 24px 10px;width:100%;max-width:1400px;margin:0 auto}
.prog{flex:1;height:16px;background:var(--border);border-radius:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--green);border-radius:8px;position:relative;transition:width .45s cubic-bezier(.22,1,.36,1)}
.prog i::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:2px;background:rgba(255,255,255,.35)}
.stepchip{font-weight:900;font-size:13px;letter-spacing:.08em;color:var(--faint);min-width:64px;text-align:right;font-variant-numeric:tabular-nums}
.lbody{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;padding:6px 24px 22px;width:100%;max-width:1400px;margin:0 auto}
@media (max-width:960px){.lbody{grid-template-columns:1fr}}

/* rotate-device hint */
.rotate-hint{position:fixed;inset:0;z-index:80;display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:rgba(10,14,16,.86);backdrop-filter:blur(6px);text-align:center;padding:28px}
@media (max-width:820px) and (orientation:portrait){.rotate-hint.show{display:flex}}
.rotate-stage{width:110px;height:110px;display:flex;align-items:center;justify-content:center}
.rotate-phone{width:56px;height:92px;border:5px solid #fff;border-radius:14px;position:relative;animation:rotatePhone 2.2s cubic-bezier(.65,0,.35,1) infinite}
.rotate-phone::after{content:"";position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:16px;height:3px;border-radius:2px;background:#fff;opacity:.7}
.rotate-arrow{position:absolute;width:34px;height:34px;color:#fff;opacity:0;animation:rotateArrow 2.2s cubic-bezier(.65,0,.35,1) infinite}
@keyframes rotatePhone{0%,12%{transform:rotate(0deg)}42%,72%{transform:rotate(-90deg)}96%,100%{transform:rotate(-90deg)}}
@keyframes rotateArrow{0%,10%{opacity:0;transform:rotate(0deg) scale(.7)}20%,38%{opacity:1;transform:rotate(-70deg) scale(1)}46%,88%{opacity:0}100%{opacity:0}}
.rotate-hint h3{color:#fff;font-size:20px;font-weight:900;letter-spacing:-.01em;margin:0}
.rotate-hint p{color:#c3d0d8;font-size:14.5px;margin:0;max-width:34ch}
@media (prefers-reduced-motion: reduce){.rotate-phone,.rotate-arrow{animation:none}.rotate-phone{transform:rotate(-90deg)}}

.stagecol{min-width:0}
.stagewrap{position:relative;margin:0 auto;max-width:100%;border:2px solid var(--border);border-radius:22px;background:var(--stage);background-image:radial-gradient(var(--dot) 1.4px,transparent 1.4px);background-size:22px 22px;overflow:hidden}
.stage{position:absolute;left:0;top:0;width:1000px;height:520px;transform-origin:0 0}
.edges{position:absolute;inset:0;width:1000px;height:520px;overflow:visible}
.edge{fill:none;stroke:var(--border2);stroke-width:3;stroke-linecap:round;transition:stroke .25s}
.edge.dashed{stroke-dasharray:8 8}
.edge.active{stroke:var(--c);stroke-width:4}
.arrow{fill:var(--border2);transition:fill .25s}.arrow.active{fill:var(--c)}
.layer{position:absolute;inset:0;pointer-events:none}

.node{position:absolute;display:flex;flex-direction:column;gap:6px;padding:11px 13px;background:var(--card);border:2px solid var(--border);border-bottom-width:5px;border-radius:18px;transition:border-color .25s,box-shadow .25s;will-change:transform,opacity}
.node.focus{border-color:var(--c);box-shadow:0 0 0 5px var(--c-soft)}
.node-head{display:flex;align-items:center;gap:10px;min-width:0}
.node-ic{width:36px;height:36px;border-radius:12px;background:var(--c);color:#fff;display:grid;place-items:center;flex:none;transition:background .25s}
.node-title{font-weight:900;font-size:15.5px;line-height:1.1;letter-spacing:-.01em;white-space:nowrap}
.node-sub{font-size:11.5px;color:var(--muted);font-weight:700;margin-top:2px;white-space:nowrap}
.k-coord{flex-direction:row;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;border-radius:999px;border-bottom-width:4px}
.k-coord .node-ic{width:30px;height:30px;border-radius:50%}
.k-coord .badge{align-self:center}
.badge{align-self:flex-start;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:10.5px;line-height:1;padding:5px 8px;border-radius:8px;background:var(--surface);border:1.5px solid var(--border);color:var(--text);animation:pop .35s cubic-bezier(.34,1.56,.64,1) backwards;white-space:nowrap}
.note{align-self:flex-start;font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--red-d);background:var(--red-soft);padding:4px 8px;border-radius:8px;animation:pop .35s backwards}
.st-warn .note{color:var(--orange-d);background:var(--orange-soft)}
.st-busy .note{color:var(--purple-d);background:var(--purple-soft)}
.st-error{border-color:var(--red)!important;animation:shake .5s}
.st-error .node-ic{background:var(--red)}
.st-warn .node-ic{background:var(--orange)}
.st-off{opacity:.5!important}.st-off .node-ic{background:var(--faint)}
.parts{display:flex;flex-direction:column;gap:5px}
.part{display:flex;align-items:center;gap:6px;height:22px}
.part-tag{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:10px;padding:3px 5px;border-radius:6px;background:var(--c-soft);color:var(--c-d);flex:none}
.recs{display:flex;gap:4px;overflow:hidden;flex:1;min-width:0}
.rec{flex:none;height:20px;padding:0 6px;border-radius:6px;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:10px;line-height:20px;color:#fff;background:var(--recc);animation:pop .45s cubic-bezier(.34,1.56,.64,1) backwards;white-space:nowrap}
.rec.pending{background:transparent;border:2px dashed var(--recc);color:var(--recc);line-height:16px}
.rec.abort{opacity:.4;text-decoration:line-through}
.rec.marker{border-radius:50%;width:20px;padding:0;text-align:center;font-weight:900}
.rec.lag{opacity:.55}
.dbrows{display:flex;flex-direction:column;gap:3px}
.dbrow{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;padding:3px 7px;border-radius:6px;background:var(--code-bg);color:var(--text);animation:pop .4s backwards;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dbrow.dup{color:var(--red-d);background:var(--red-soft);text-decoration:line-through}
.dbrow.gone{opacity:.35;text-decoration:line-through}
.dbrow.head{background:transparent;color:var(--faint);padding:0 2px;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase}

.chip{position:absolute;left:0;top:0;display:flex;align-items:center;gap:7px;padding:6px 11px 6px 9px;border-radius:999px;background:var(--cc);color:#fff;font-weight:900;font-size:12px;line-height:1.1;box-shadow:0 3px 0 var(--shadow);white-space:nowrap;z-index:5}
.chip small{display:block;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:9.5px;opacity:.9;margin-top:2px}
.chip .chip-ic{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;flex:none}
.chip.dropped{background:var(--red)}

/* inspector */
.insp{border:2px solid var(--border);border-radius:22px;background:var(--card);padding:16px;display:flex;flex-direction:column;gap:12px;align-self:start;min-height:200px}
.insp-title{display:flex;align-items:center;gap:8px;font-weight:900;font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.insp-title .dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.insp h4{margin:0;font-size:17px;font-weight:900;letter-spacing:-.01em}
.insp-sec{display:flex;flex-direction:column;gap:6px;animation:rise .35s backwards}
.insp-lab{font-size:11px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:700}
.kv .k{color:var(--purple-d)}.kv .v{color:var(--text);word-break:break-all}
.hdr{display:flex;flex-wrap:wrap;gap:5px}
.hdr span{font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;padding:4px 7px;border-radius:8px;background:var(--blue-soft);color:var(--blue-d);border:1.5px solid transparent}
.hdr span b{color:var(--text);font-weight:700}
pre.payload{margin:0;padding:10px 12px;border-radius:12px;background:var(--code-bg);font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:600;line-height:1.5;overflow-x:auto;color:var(--text)}
.pl-k{color:var(--orange-d)}.pl-s{color:var(--green-d)}.pl-n{color:var(--blue-d)}
.legend-list{display:flex;flex-direction:column;gap:8px}
.legend-list li{list-style:none;display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.legend-list .sw{width:12px;height:12px;border-radius:4px;background:var(--c);flex:none;margin-top:5px}
.legend-list ul{margin:0;padding:0}
.insp-note{font-size:13.5px;color:var(--muted);border-left:4px solid var(--yellow);padding:4px 0 4px 12px;border-radius:2px}
.checks{margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.checks li{list-style:none;display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.checks .ck{width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;flex:none}

/* footer */
.lfoot{position:sticky;bottom:0;z-index:30;border-top:2px solid var(--border);background:var(--surface);padding:16px 24px;box-shadow:0 -10px 22px -14px var(--shadow)}
.lfoot-in{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:22px;justify-content:space-between}
.caption{flex:1;min-width:0;animation:rise .4s cubic-bezier(.22,1,.36,1) backwards}
.eyebrow{font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--c-d);display:flex;align-items:center;gap:8px;margin-bottom:4px}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block}
.caption h2{font-size:21px;font-weight:900;letter-spacing:-.015em;line-height:1.15}
.caption p{margin:6px 0 0;font-size:15px;color:var(--muted);max-width:78ch}
.caption p b{color:var(--text)}
.ctl{display:flex;gap:12px;flex:none}
@media (max-width:700px){.lfoot-in{flex-direction:column;align-items:stretch}.ctl{justify-content:flex-end}}

/* done */
.done{min-height:100vh;display:grid;place-items:center;position:relative;overflow:hidden;padding:24px}
.done canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.done-card{position:relative;text-align:center;max-width:520px;display:flex;flex-direction:column;align-items:center;gap:18px;animation:rise .5s cubic-bezier(.22,1,.36,1) backwards}
.trophy{width:120px;height:120px;border-radius:36px;background:var(--yellow);color:#5b4300;display:grid;place-items:center;box-shadow:0 8px 0 var(--yellow-d);animation:bounce 1.2s cubic-bezier(.34,1.56,.64,1)}
.done h1{font-size:36px;font-weight:900;letter-spacing:-.02em;color:var(--yellow-d)}
.done p{margin:0;color:var(--muted);font-size:17px}
.tiles{display:flex;gap:14px;margin-top:6px}
.tile{border:2px solid var(--c);border-radius:16px;overflow:hidden;min-width:130px;background:var(--card)}
.tile .tl{background:var(--c);color:#fff;font-size:11px;font-weight:900;letter-spacing:.1em;padding:6px}
.tile .tv{padding:12px;font-size:24px;font-weight:900;color:var(--c-d);display:flex;justify-content:center;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.done .ctl{margin-top:10px}

@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{0%,100%{translate:0}20%{translate:-6px}40%{translate:6px}60%{translate:-4px}80%{translate:4px}}
@keyframes bounce{0%{transform:scale(0) rotate(-20deg)}60%{transform:scale(1.15) rotate(6deg)}100%{transform:none}}
@media (prefers-reduced-motion: reduce){
  .rec,.badge,.note,.dbrow,.insp-sec,.caption,.done-card,.trophy{animation:none}
  .st-error{animation:none}
}
</style>

<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const {useState,useEffect,useRef,useMemo,useLayoutEffect} = React;
const h = React.createElement;
const cx = (...a)=>a.filter(Boolean).join(' ');
const RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

const MD = s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`(.+?)`/g,'<code>$1</code>');

/* ---------- icons ---------- */
const ICONS={
  send:'<path d="M3 11l18-8-8 18-2-8-8-2z"/><path d="M11 13l10-10"/>',
  gear:'<circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>',
  db:'<ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v13c0 1.7 3.6 3 8 3s8-1.3 8-3v-13"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',
  topic:'<path d="M4 6h16M4 12h16M4 18h10"/><circle cx="20" cy="18" r="1.4" fill="currentColor" stroke="none"/>',
  coord:'<circle cx="12" cy="12" r="3"/><circle cx="5" cy="6" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="5" cy="18" r="2"/><circle cx="19" cy="18" r="2"/><path d="M6.6 7.4l3.2 2.6M14.2 10l3.2-2.6M6.6 16.6l3.2-2.6M14.2 14l3.2 2.6"/>',

/* ---------- geometry ---------- */
const center=n=>({x:n.x+n.w/2,y:n.y+n.h/2});
function bezier(a,b,bend){
  const ca=center(a),cb=center(b);const dx=cb.x-ca.x,dy=cb.y-ca.y;
  let p0,p3,k;
  if(Math.abs(dx)>Math.abs(dy)*1.15){const s=dx>0?1:-1;p0={x:ca.x+s*a.w/2,y:ca.y};p3={x:cb.x-s*b.w/2,y:cb.y};k={x:(p3.x-p0.x)*.5,y:0};}
  else{const s=dy>0?1:-1;p0={x:ca.x,y:ca.y+s*a.h/2};p3={x:cb.x,y:cb.y-s*b.h/2};k={x:0,y:(p3.y-p0.y)*.5};}
  if(bend)return {p0,p1:{...bend},p2:{...bend},p3};
  return {p0,p1:{x:p0.x+k.x,y:p0.y+k.y},p2:{x:p3.x-k.x,y:p3.y-k.y},p3};
}
const edgeList=j=>j.edges.map(e=>Array.isArray(e)?{from:e[0],to:e[1]}:e);
function bendFor(j,from,to){const e=edgeList(j).find(e=>(e.from===from&&e.to===to)||(e.from===to&&e.to===from));return e&&e.bend;}
const cubic=(t,b)=>{const u=1-t;return{x:u*u*u*b.p0.x+3*u*u*t*b.p1.x+3*u*t*t*b.p2.x+t*t*t*b.p3.x,y:u*u*u*b.p0.y+3*u*u*t*b.p1.y+3*u*t*t*b.p2.y+t*t*t*b.p3.y};};
const arrowPoly=(b)=>{const ang=Math.atan2(b.p3.y-b.p2.y,b.p3.x-b.p2.x);const L=11,W=6;const tip=b.p3;const bx=tip.x-Math.cos(ang)*L,by=tip.y-Math.sin(ang)*L;const nx=-Math.sin(ang)*W,ny=Math.cos(ang)*W;return `${tip.x},${tip.y} ${bx+nx},${by+ny} ${bx-nx},${by-ny}`;};

/* ---------- state merge ---------- */
function settle(v){const c={...v};if(c.recs)c.recs=c.recs.map(p=>p.map(r=>({...r,at:0})));if(c.rows)c.rows=c.rows.map(r=>typeof r==='string'?r:{...r,at:0});return c;}
function cumulative(journey,idx){const s={};for(let i=0;i<=idx;i++){const ss=journey.steps[i].states||{};for(const id in ss)s[id]=i<idx?settle(ss[id]):ss[id];}return s;}

/* ---------- components ---------- */
function Node({n,st,elRef}){
  const style={left:n.x,top:n.y,width:n.w,height:n.h,'--c':`var(--${n.color})`,'--c-d':`var(--${n.color}-d)`,'--c-soft':`var(--${n.color}-soft)`};
  const status=st.status||'ok';
  let body=null;
  if(n.kind==='topic'){
    body=h('div',{className:'parts'},Array.from({length:n.parts},(_,i)=>h('div',{className:'part',key:i},
      h('span',{className:'part-tag'},'P'+i),
      h('div',{className:'recs'},...((st.recs&&st.recs[i])||[]).map((r,j)=>h('span',{key:j+':'+r.k+':'+(r.s||''),className:cx('rec',r.s),style:{'--recc':`var(--${r.c||n.color})`,animationDelay:(r.at||0)+'s'}},r.k))))));
  } else if(n.kind==='db'){
    body=h('div',{className:'dbrows'},...(st.rows||[]).map((r,i)=>{const o=typeof r==='string'?{t:r}:r;return h('div',{key:i+':'+o.t+':'+(o.s||''),className:cx('dbrow',o.s),style:{animationDelay:(o.at||0)+'s'}},o.t);}));
  }
  return h('div',{ref:elRef,className:cx('node','k-'+n.kind,'st-'+status),style,'data-id':n.id},
    h('div',{className:'node-head'},h('div',{className:'node-ic'},Icon(n.icon||KIND_ICON[n.kind],19)),
      h('div',null,h('div',{className:'node-title'},n.label),n.sub&&h('div',{className:'node-sub'},n.sub))),
    body,
    st.badge&&h('div',{className:'badge',key:'b:'+st.badge},st.badge),
    st.note&&h('div',{className:'note',key:'n:'+st.note},st.note));
}

function fly(layer,nodes,m,tl,at,edgeEls,bend){
  const a=nodes[m.from],b=nodes[m.to];const bz=bezier(a,b,bend);
  const el=document.createElement('div');el.className='chip';el.style.setProperty('--cc',`var(--${m.color||'blue'})`);
  el.innerHTML=`<span class="chip-ic">${SVG('envelope',12)}</span><span><span class="chip-l">${esc(m.label)}</span>${m.sub?`<small>${esc(m.sub)}</small>`:''}</span>`;
  layer.appendChild(el);
  gsap.set(el,{x:bz.p0.x,y:bz.p0.y,xPercent:-50,yPercent:-50,scale:0,opacity:0});
  const key=`${m.from}>${m.to}`,rkey=`${m.to}>${m.from}`;
  const edges=[...(edgeEls[key]||[]),...(edgeEls[rkey]||[])];
  const color=`var(--${m.color||'blue'})`;
  const o={t:0};const dur=m.dur||1.1;
  tl.call(()=>edges.forEach(e=>{e.classList.add('active');e.style.setProperty('--c',color);}),null,at);
  tl.to(el,{scale:1,opacity:1,duration:.25,ease:'back.out(2.5)'},at);
  tl.to(o,{t:m.drop?.86:1,duration:dur,ease:m.drop?'power2.out':'power1.inOut',onUpdate(){const q=cubic(o.t,bz);gsap.set(el,{x:q.x,y:q.y});}},at+.15);
  const end=at+.15+dur;
  if(m.drop){
    tl.call(()=>{el.classList.add('dropped');const wrap=el.lastElementChild;let s=wrap.querySelector('small');if(!s){s=document.createElement('small');wrap.appendChild(s);}s.textContent=m.dropLabel||'rejected';el.firstElementChild.innerHTML=SVG('x',12);},null,end);
    tl.to(el,{x:'+=7',duration:.06,repeat:5,yoyo:true},end);
    tl.to(el,{opacity:0,scale:.6,duration:.4},end+1.1);
  } else {
    tl.to(el,{scale:1.28,duration:.14,yoyo:true,repeat:1,ease:'power1.inOut'},end);
    tl.to(el,{opacity:0,scale:.5,duration:.3},end+.4);
  }
  tl.call(()=>edges.forEach(e=>e.classList.remove('active')),null,end+.5);
  return end+.75;
}

function Stage({journey,stepIdx}){
  const wrapRef=useRef(),stageRef=useRef(),layerRef=useRef();const nodeRefs=useRef({});
  const [scale,setScale]=useState(1);
  const step=journey.steps[stepIdx];
  const st=useMemo(()=>cumulative(journey,stepIdx),[journey,stepIdx]);
  const nodes=useMemo(()=>Object.fromEntries(journey.nodes.map(n=>[n.id,n])),[journey]);
  useLayoutEffect(()=>{
    const col=wrapRef.current.parentElement;
    const fit=()=>{const w=col.clientWidth;const availH=window.innerHeight-col.getBoundingClientRect().top-window.scrollY-170;setScale(Math.max(.3,Math.min(w/1000,Math.max(availH,340)/520)));};
    const ro=new ResizeObserver(fit);ro.observe(col);window.addEventListener('resize',fit);fit();
    return()=>{ro.disconnect();window.removeEventListener('resize',fit);};
  },[]);
  useEffect(()=>{
    const layer=layerRef.current;layer.innerHTML='';
    const tl=gsap.timeline();if(RM)tl.timeScale(4);
    const focus=step.focus;
    journey.nodes.forEach(n=>{const el=nodeRefs.current[n.id];if(!el)return;const f=!focus||focus.includes(n.id);el.classList.toggle('focus',!!focus&&f);gsap.to(el,{opacity:f?1:.32,scale:(focus&&f)?1.045:1,duration:.4,ease:'power2.out',transformOrigin:'50% 50%'});});
    const edgeEls={};stageRef.current.querySelectorAll('[data-edge]').forEach(e=>{e.classList.remove('active');(edgeEls[e.dataset.edge]=edgeEls[e.dataset.edge]||[]).push(e);});
    let cursor=.35;
    (step.messages||[]).forEach(m=>{const at=m.at!=null?m.at:cursor;cursor=fly(layer,nodes,m,tl,at,edgeEls,bendFor(journey,m.from,m.to));});
    return()=>{tl.kill();layer.innerHTML='';};
  },[journey,stepIdx]);
  const edges=useMemo(()=>{
    const list=edgeList(journey);
    const keys=new Set(list.map(e=>e.from+'>'+e.to));const seen=new Set();const out=[];
    list.forEach(e=>{const k=e.from+'>'+e.to,r=e.to+'>'+e.from;if(seen.has(r))return;seen.add(k);out.push({...e,bi:keys.has(r)});});
    return out;
  },[journey]);
  return h('div',{className:'stagecol'},h('div',{ref:wrapRef,className:'stagewrap',style:{width:1000*scale,height:520*scale}},
    h('div',{ref:stageRef,className:'stage',style:{transform:`scale(${scale})`}},
      h('svg',{className:'edges',viewBox:'0 0 1000 520'},
        ...edges.flatMap(e=>{const b=bezier(nodes[e.from],nodes[e.to],e.bend);const d=`M${b.p0.x},${b.p0.y} C${b.p1.x},${b.p1.y} ${b.p2.x},${b.p2.y} ${b.p3.x},${b.p3.y}`;const k=e.from+'>'+e.to;
          const els=[h('path',{key:k,className:cx('edge',e.dashed&&'dashed'),d,'data-edge':k}),h('polygon',{key:k+'a',className:'arrow',points:arrowPoly(b),'data-edge':k})];
          if(e.bi){const rb=bezier(nodes[e.to],nodes[e.from],e.bend);els.push(h('polygon',{key:k+'r',className:'arrow',points:arrowPoly(rb),'data-edge':k}));}
          return els;})),
      ...journey.nodes.map(n=>h(Node,{key:n.id,n,st:st[n.id]||{},elRef:el=>nodeRefs.current[n.id]=el})),
      h('div',{ref:layerRef,className:'layer'}))));
}

function fmtJSON(o){
  return JSON.stringify(o,null,2).replace(/"([^"]+)":/g,'<span class="pl-k">"$1"</span>:').replace(/: "([^"]*)"/g,': <span class="pl-s">"$1"</span>').replace(/: (-?\d[\d.]*)/g,': <span class="pl-n">$1</span>');
}
function Inspector({step,journey}){
  const ins=step.inspect;
  return h('aside',{className:'insp',key:journey.id+':'+step.title},
    h('div',{className:'insp-title'},h('span',{className:'dot'}),ins?'Inspector':'Inspector'),
    ins?[
      h('h4',{key:'t'},ins.title),
      ins.list&&h('div',{key:'l',className:'insp-sec'},h('ul',{className:'legend-list'},...ins.list.map((it,i)=>h('li',{key:i},h('span',{className:'sw',style:{'--c':`var(--${it.c})`}}),h('span',{dangerouslySetInnerHTML:{__html:MD(it.t)}}))))),
      ins.kv&&h('div',{key:'k',className:'insp-sec'},h('div',{className:'insp-lab'},'Values'),h('div',{className:'kv'},...Object.entries(ins.kv).flatMap(([k,v])=>[h('span',{key:k+'k',className:'k'},k),h('span',{key:k+'v',className:'v'},v)]))),
      ins.headers&&h('div',{key:'h',className:'insp-sec'},h('div',{className:'insp-lab'},'Headers'),h('div',{className:'hdr'},...Object.entries(ins.headers).map(([k,v])=>h('span',{key:k},k+': ',h('b',null,v))))),
      ins.payload&&h('div',{key:'p',className:'insp-sec'},h('div',{className:'insp-lab'},'Payload'),h('pre',{className:'payload',dangerouslySetInnerHTML:{__html:fmtJSON(ins.payload)}})),
      ins.checks&&h('div',{key:'c',className:'insp-sec'},h('ul',{className:'checks'},...ins.checks.map((t,i)=>h('li',{key:i},h('span',{className:'ck'},Icon('check',13,{strokeWidth:3})),h('span',null,t))))),
      ins.note&&h('div',{key:'n',className:'insp-sec'},h('div',{className:'insp-note'},ins.note)),
    ]:h('p',{style:{margin:0,color:'var(--muted)',fontSize:14}},'Watch the stage — the message chips carry the key and the interesting header for this step.'));
}

function RotateHint({dismissed,onDismiss}){
  return h('div',{className:cx('rotate-hint',!dismissed&&'show')},
    h('div',{className:'rotate-stage'},h('div',{className:'rotate-phone'}),h('div',{className:'rotate-arrow'},Icon('refresh',34,{strokeWidth:2.4}))),
    h('h3',null,'Cihazını yan çevir'),
    h('p',null,'Kafka sahnesi geniş yer istiyor — yatay modda çok daha rahat izlenir.'),
    h('button',{className:'btn ghost sm',onClick:onDismiss},'Yine de devam et'));
}

function Lesson({journey,onExit,onDone}){
  const [idx,setIdx]=useState(0);
  const [rotateDismissed,setRotateDismissed]=useState(false);
  const n=journey.steps.length;const step=journey.steps[idx];
  const next=()=>idx<n-1?setIdx(idx+1):onDone();
  const prev=()=>idx>0&&setIdx(idx-1);
  useEffect(()=>{const k=e=>{if(e.key==='ArrowRight'||e.key===' '||e.key==='Enter'){e.preventDefault();next();}else if(e.key==='ArrowLeft')prev();else if(e.key==='Escape')onExit();};window.addEventListener('keydown',k);return()=>window.removeEventListener('keydown',k);},[idx,n]);
  const colorVars={'--c':`var(--${journey.color})`,'--c-d':`var(--${journey.color}-d)`,'--c-soft':`var(--${journey.color}-soft)`};
  return h('div',{className:'lesson',style:colorVars},
    h(RotateHint,{dismissed:rotateDismissed,onDismiss:()=>setRotateDismissed(true)}),
    h('div',{className:'lhead'},
      h('button',{className:'btn ghost icon',onClick:onExit,'aria-label':'Back to journeys'},Icon('x',20,{strokeWidth:3})),
      h('div',{className:'prog'},h('i',{style:{width:`${((idx+1)/n)*100}%`}})),
      h('div',{className:'stepchip'},`${idx+1} / ${n}`)),
    h('div',{className:'lbody'},h(Stage,{journey,stepIdx:idx}),h(Inspector,{step,journey})),
    h('div',{className:'lfoot'},h('div',{className:'lfoot-in'},
      h('div',{className:'caption',key:idx},
        h('div',{className:'eyebrow'},h('i'),journey.title,' · step ',idx+1),
        h('h2',null,step.title),
        h('p',{dangerouslySetInnerHTML:{__html:MD(step.text)}})),
      h('div',{className:'ctl'},
        h('button',{className:'btn ghost',onClick:prev,disabled:idx===0},Icon('left',18,{strokeWidth:3}),'Back'),
        h('button',{className:'btn',onClick:next},idx===n-1?'Finish':'Next',idx===n-1?Icon('crown',18):null)))));
}

function confetti(canvas){
  const ctx=canvas.getContext('2d');const dpr=window.devicePixelRatio||1;
  const W=canvas.clientWidth,H=canvas.clientHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.scale(dpr,dpr);
  const colors=['#58cc02','#1cb0f6','#ff9600','#ff4b4b','#ce82ff','#ffc800'];
  const ps=Array.from({length:RM?0:180},()=>({x:W/2+(Math.random()-.5)*160,y:H*.45,vx:(Math.random()-.5)*14,vy:-Math.random()*16-6,g:.35,w:6+Math.random()*8,h:4+Math.random()*6,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,c:colors[Math.floor(Math.random()*colors.length)],life:1}));
  let t0=performance.now(),raf;
  const tick=now=>{const dt=Math.min((now-t0)/16.7,2);t0=now;ctx.clearRect(0,0,W,H);let alive=false;
    ps.forEach(p=>{p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.99;p.r+=p.vr*dt;if(p.y>H*.6)p.life-=.012*dt;if(p.life<=0)return;alive=true;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();});
    if(alive)raf=requestAnimationFrame(tick);};
  raf=requestAnimationFrame(tick);return()=>cancelAnimationFrame(raf);
}
function Done({journey,onHome,onReplay}){
  const ref=useRef();useEffect(()=>confetti(ref.current),[]);
  const xp=journey.steps.length*10;
  return h('div',{className:'done'},h('canvas',{ref:ref}),
    h('div',{className:'done-card'},
      h('div',{className:'trophy'},Icon('crown',64,{strokeWidth:2})),
      h('h1',null,'Journey complete!'),
      h('p',null,'You walked through ',h('b',null,journey.title),' end to end.'),
      h('div',{className:'tiles'},
        h('div',{className:'tile',style:{'--c':'var(--yellow)','--c-d':'var(--yellow-d)'}},h('div',{className:'tl'},'TOTAL XP'),h('div',{className:'tv'},Icon('bolt',20),xp)),
        h('div',{className:'tile',style:{'--c':'var(--blue)','--c-d':'var(--blue-d)'}},h('div',{className:'tl'},'STEPS'),h('div',{className:'tv'},journey.steps.length))),
      h('div',{className:'ctl'},h('button',{className:'btn ghost',onClick:onReplay},Icon('refresh',18,{strokeWidth:3}),'Replay'),h('button',{className:'btn',onClick:onHome},'Continue'))));
}

function Home({completed,onStart}){
  const xp=JOURNEYS.filter(j=>completed.has(j.id)).reduce((a,j)=>a+j.steps.length*10,0);
  return h('div',{className:'home'},
    h('div',{className:'topbar'},
      h('div',{className:'brand'},h('span',{className:'brand-mark'},Icon('bolt',22,{strokeWidth:2.6})),'Kafka Journey'),
      h('div',{className:'stats'},h('div',{className:'stat crown'},Icon('crown',18),`${completed.size} / ${JOURNEYS.length}`),h('div',{className:'stat xp'},Icon('bolt',18),`${xp} XP`))),
    h('div',{className:'hero'},h('h1',null,'Pick a journey'),h('p',null,'Each one is a short, animated walk through a real Kafka scenario. Step through with Next, watch the records move, and inspect the headers and payloads as they fly.')),
    h('div',{className:'grid'},...JOURNEYS.map(j=>h('button',{key:j.id,className:'jcard',onClick:()=>onStart(j),style:{'--c':`var(--${j.color})`,'--c-d':`var(--${j.color}-d)`,'--c-soft':`var(--${j.color}-soft)`}},
      h('div',{className:'jcard-band'},h('span',{className:'ring',style:{width:170,height:170,left:-50,top:-70}}),h('span',{className:'ring',style:{width:120,height:120,right:-30,bottom:-60}}),h('span',{className:'big'},Icon(j.icon,32,{strokeWidth:2.4}))),
      completed.has(j.id)&&h('span',{className:'done-pill'},Icon('crown',13,{strokeWidth:3}),'DONE'),
      h('div',{className:'jcard-body'},h('h3',null,j.title),h('p',null,j.blurb),
        h('div',{className:'jcard-meta'},h('span',null,`${j.steps.length} steps · ${j.minutes} min`),h('span',{className:'jcard-cta'},completed.has(j.id)?'Replay':'Start',Icon('play',12,{strokeWidth:3}))))))),
    h('div',{className:'legend'},
      h('span',{className:'k'},Icon('envelope',16),'chip = a record or request in flight'),
      h('span',{className:'k',style:{color:'var(--red-d)'}},Icon('x',16,{strokeWidth:3}),'red chip = dropped / rejected'),
      h('span',{className:'k'},'keys: → next · ← back · esc exit')));
}

function App(){
  const [screen,setScreen]=useState('home');const [journey,setJourney]=useState(null);
  const [completed,setCompleted]=useState(()=>{try{return new Set(JSON.parse(localStorage.getItem('kj-done')||'[]'));}catch(e){return new Set();}});
  const [runKey,setRunKey]=useState(0);
  const start=j=>{setJourney(j);setRunKey(k=>k+1);setScreen('lesson');window.scrollTo(0,0);};
  const done=()=>{const s=new Set(completed);s.add(journey.id);setCompleted(s);try{localStorage.setItem('kj-done',JSON.stringify([...s]));}catch(e){}setScreen('done');};
  if(screen==='lesson')return h(Lesson,{key:runKey,journey,onExit:()=>setScreen('home'),onDone:done});
  if(screen==='done')return h(Done,{journey,onHome:()=>setScreen('home'),onReplay:()=>start(journey)});
  return h(Home,{completed,onStart:start});
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
